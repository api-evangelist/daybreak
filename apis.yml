aid: daybreak
name: Daybreak
description: Daybreak Health is a B2B mental health company that delivers teletherapy
  and mental health programs for K-12 students (ages 5-19) in partnership with school
  districts and health plans. Its services include one-on-one teletherapy, in-person
  and hybrid onsite programs, universal mental health screeners, and mental health
  classes, with programs tailored for BIPOC, LGBTQIA+, and low-income student populations.
  Daybreak is a care-delivery organization sold to schools and payers rather than a
  developer platform; as of this enrichment pass it publishes no public developer or
  API surface. This APIs.json profile captures the company's public web properties
  and domain-security posture.
